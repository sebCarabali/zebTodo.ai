<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Timer App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Auth Section -->
        <div id="auth-section" class="container">
            <h1>🚀 Todo Timer</h1>
            <div class="auth-box">
                <h2 id="auth-title">Sign In</h2>
                <form id="auth-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" id="auth-btn">Sign In</button>
                </form>
                <p id="auth-toggle">Don't have an account? <a href="#" id="toggle-auth">Sign Up</a></p>
                <p id="auth-error" class="error"></p>
            </div>
        </div>

        <!-- Main App Section -->
        <div id="main-section" class="container hidden">
            <header>
                <h1>🚀 Todo Timer</h1>
                <div class="user-info">
                    <span id="user-display"></span>
                    <button id="logout-btn">Logout</button>
                </div>
            </header>

            <!-- Projects Tab -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="projects">Projects</button>
                <button class="tab-btn" data-tab="tasks">My Tasks</button>
            </div>

            <!-- Projects View -->
            <div id="projects-view" class="view active">
                <div class="section-header">
                    <h2>Projects</h2>
                    <button id="new-project-btn" class="btn-primary">+ New Project</button>
                </div>
                <div id="projects-list" class="grid"></div>
            </div>

            <!-- Tasks View -->
            <div id="tasks-view" class="view hidden">
                <div class="section-header">
                    <h2 id="current-project-title">Tasks</h2>
                    <button id="new-task-btn" class="btn-primary" disabled>+ New Task</button>
                </div>
                <div id="tasks-list" class="list"></div>
            </div>
        </div>

        <!-- Modals -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <h3 id="modal-title"></h3>
                <form id="modal-form"></form>
                <div class="modal-actions">
                    <button id="modal-cancel" class="btn-secondary">Cancel</button>
                    <button id="modal-submit" class="btn-primary">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
